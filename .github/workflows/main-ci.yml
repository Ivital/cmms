name: CI & Deploy TOIR2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: toir2-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/ivital/cmms-backend
  FRONTEND_IMAGE: ghcr.io/ivital/cmms-frontend

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Run backend tests
        working-directory: api
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          mvn --batch-mode test \
            -DargLine="--add-opens java.base/java.lang=ALL-UNNAMED"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  build-images:
    name: Build and push images
    if: github.event_name != 'pull_request'
    needs:
      - backend-tests
      - frontend-build

    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy TOIR2
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - build-images

    runs-on:
      - self-hosted
      - linux
      - x64
      - cmms

    timeout-minutes: 20

    environment:
      name: production
      url: https://www.toir2.zakryttya.org.ua

    steps:
      - name: Deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/deploy-cmms "${GITHUB_SHA}"

      - name: Public smoke test
        shell: bash
        run: |
          set -Eeuo pipefail

          curl --fail --silent --show-error \
            https://www.toir2.zakryttya.org.ua/api/health-check

          curl --fail --silent --show-error \
            --head \
            https://www.toir2.zakryttya.org.ua/

          echo
          echo "Public smoke test passed"
